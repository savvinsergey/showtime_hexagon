<header class="header">
  <div class="header__wrapper">
    <button hlmSidebarTrigger aria-label="Toggle sidebar menu"></button>

    <hlm-separator orientation="vertical" class="header__separator" />

    <nav hlmBreadcrumb class="header__breadcrumbs">
      <ol hlmBreadcrumbList>
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink link="/">Admin panel</a>
        </li>
      </ol>
    </nav>

    <div hlmInputGroup class="header__search">
      <input hlmInputGroupInput placeholder="Type to search..." />
      <div hlmInputGroupAddon>
        <ng-icon name="lucideSearch" />
      </div>
    </div>
  </div>
</header>
